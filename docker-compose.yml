version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: symfony-nginx
    labels:
      - "com.docker.compose.project=Gad-Sanchez-Symfony-Reactjs-Challenge"
      - "description=Nginx web server for Symfony application"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - symfony-network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony-php
    labels:
      - "com.docker.compose.project=Gad-Sanchez-Symfony-Reactjs-Challenge"
      - "description=PHP-FPM backend for Symfony application"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
    networks:
      - symfony-network

networks:
  symfony-network:
    driver: bridge
